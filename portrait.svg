<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-label="Abstract illustration of a planet and its moon">
  <defs>
    <clipPath id="limb">
      <circle cx="240" cy="290" r="88"/>
    </clipPath>
  </defs>

  <rect width="480" height="600" fill="#F0ECE0"/>

  <!-- orbital rings -->
  <circle cx="240" cy="290" r="140" fill="none" stroke="#D8D2BE" stroke-width="1"/>
  <circle cx="240" cy="290" r="196" fill="none" stroke="#D8D2BE" stroke-width="1" stroke-dasharray="1 6"/>
  <circle cx="240" cy="290" r="246" fill="none" stroke="#D8D2BE" stroke-width="1" stroke-dasharray="260 400" stroke-linecap="round" transform="rotate(-40 240 290)"/>

  <!-- planet -->
  <circle cx="240" cy="290" r="88" fill="#AE4A22"/>
  <g clip-path="url(#limb)" fill="none" stroke="#F6F3EC" stroke-width="1" opacity="0.55">
    <ellipse cx="240" cy="262" rx="120" ry="34"/>
    <ellipse cx="240" cy="296" rx="128" ry="40"/>
    <ellipse cx="240" cy="330" rx="118" ry="34"/>
  </g>

  <!-- moon on the outer orbit -->
  <circle cx="433" cy="207" r="6.5" fill="#221F1B"/>

  <!-- hairline frame -->
  <rect x="0.5" y="0.5" width="479" height="599" fill="none" stroke="#E2DBC9"/>
</svg>
